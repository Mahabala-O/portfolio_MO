<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A SQL skills check: 14 LeetCode-style query tasks with hidden edge-case tests and 11 concept checks, run in the browser, ending in a skill map.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>SQL Skills Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sql/core.css">
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">SQL Lab · Diagnostic · <a href="sql-practice.html">Practice →</a></p>
    <h1>SQL skills check</h1>
    <p class="engine" id="engine">Loading the SQL engine…</p>
  </header>
  <nav class="steps" id="steps" aria-label="Sections"></nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script src="sql/core.js"></script>
<script src="sql/lab-bank.js"></script>
<script>
// The diagnostic: tasks and concept checks from sql/lab-bank.js, the task workspace from sql/core.js, and a report.
const L = SQLLab, { SKILLS, TASKS, CONCEPTS } = LAB_BANK, { esc, inl } = L;

/* ---------- State (this version's answers are kept apart from the first version's) ---------- */
const KEY = 'sql-lab-diagnostic-v2';
let state = { tasks: {}, concepts: {}, started: null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tasks) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const ts = id => state.tasks[id] || (state.tasks[id] = L.blankState());

/* ---------- Navigation ---------- */
let current = 'start', workspace = null;
function renderSteps() {
  const nav = document.getElementById('steps');
  const b = (id, label, cls, title) => `<button type="button" data-go="${id}" class="${cls || ''}" ${current === id ? 'aria-current="true"' : ''} title="${esc(title || label)}">${label}</button>`;
  let h = b('start', 'Start') + '<span class="sep"></span>';
  TASKS.forEach((t, i) => { const s = state.tasks[t.id]; h += b(t.id, String(i + 1), s ? s.status : '', `${i + 1}. ${t.title}`); });
  h += '<span class="sep"></span>' + b('concepts', `Concepts <span class="muted">${CONCEPTS.filter(c => c.id in state.concepts).length}/${CONCEPTS.length}</span>`) + b('report', 'Report');
  nav.innerHTML = h;
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
document.getElementById('steps').addEventListener('click', e => { const el = e.target.closest('[data-go]'); if (el) go(el.dataset.go); });
function go(id) {
  if (workspace) { workspace.destroy(); workspace = null; }
  current = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  renderSteps();
  const v = document.getElementById('view');
  if (id === 'start') v.innerHTML = startHTML();
  else if (id === 'concepts') renderConcepts(v);
  else if (id === 'report') renderReport(v);
  else renderTask(v, TASKS.find(t => t.id === id));
  window.scrollTo({ top: 0 });
}

/* ---------- Start ---------- */
function startHTML() {
  const touched = TASKS.some(t => state.tasks[t.id] && state.tasks[t.id].status !== 'untouched');
  return `<div class="card prompt">
  <h2>What this is</h2>
  <p>A diagnostic, not a course. ${TASKS.length} query tasks in the style of LeetCode's database problems, from warm-ups to the window-function work behind problems like Seasonal Sales Analysis, then ${CONCEPTS.length} quick concept checks. The report maps what's solid and what's a gap. To train the gaps, use <a href="sql-practice.html">SQL Practice</a>.</p>
  <h3>How a task works</h3>
  <ul>
    <li><b>Run</b> shows your output next to the expected output for the data you have selected (the sample data, to start with).</li>
    <li><b>Submit</b> also checks hidden tests: extra rows that probe edge cases (ties, NULLs, duplicates, date boundaries). A hidden test that fails opens as a tab, so you can Run against it while you fix your query. "Custom data" lets you add rows of your own.</li>
    <li>If your query uses CTEs, the menu next to Run shows the output of any one step.</li>
    <li>Hints and "show solution" are there when you're stuck. They're recorded, and that's fine: an honest map is the point.</li>
  </ul>
  <h3>Checked the way LeetCode and interviewers check</h3>
  <ul>
    <li><b>Column names and their order must match the prompt</b> (letter case doesn't matter). Name computed columns with <code>AS</code>.</li>
    <li><b>If the prompt asks for an order, your final query needs an <code>ORDER BY</code></b>, even when the rows happen to come out sorted.</li>
    <li><b>Rounding is checked.</b> "Rounded to 1 decimal" means <code>ROUND(…, 1)</code>.</li>
    <li>Every requirement in a prompt has a test behind it.</li>
  </ul>
  <h3>The engine is SQLite, with MySQL functions</h3>
  <ul>
    <li>Window functions, CTEs, <code>CASE</code>, <code>COALESCE</code>, <code>IFNULL</code> and <code>LIMIT</code> work as on LeetCode.</li>
    <li>MySQL functions you can use: <code>YEAR</code>, <code>MONTH</code>, <code>DAY</code>, <code>HOUR</code>, <code>QUARTER</code>, <code>DATEDIFF(a, b)</code>, <code>DATE_ADD(d, INTERVAL 1 DAY)</code>, <code>DATE_SUB</code>, <code>DATE_FORMAT(d, '%Y-%m')</code>, <code>LAST_DAY</code>, <code>DAYNAME</code>, <code>IF</code>, <code>LEFT</code>, <code>RIGHT</code>, <code>CONCAT</code>, <code>GREATEST</code>, <code>LEAST</code>.</li>
    <li>Dates are stored as text like <code>'2025-03-01'</code>, so they sort and compare correctly as strings.</li>
    <li>Two differences from MySQL: integer ÷ integer is an integer here (<code>1/3 = 0</code>), so write <code>1.0 * a / b</code>; and <code>d + INTERVAL 1 DAY</code> isn't supported, so use <code>DATE_ADD</code>.</li>
  </ul>
  <p class="muted">Progress saves in this browser as you go. Shortcuts in the editor: ⌘/Ctrl + Enter runs, ⌘/Ctrl + Shift + Enter submits.</p>
  <div class="actions"><button class="btn primary" type="button" id="begin" ${L.ready() ? '' : 'disabled'}>${touched ? 'Continue' : 'Start with task 1'}</button>
  <button class="btn" type="button" data-jump="report">See report</button></div>
  </div>`;
}
document.getElementById('view').addEventListener('click', e => {
  if (e.target.id === 'begin') {
    if (!state.started) { state.started = new Date().toISOString(); save(); }
    const next = TASKS.find(t => !state.tasks[t.id] || !L.isDone(state.tasks[t.id]));
    go(next ? next.id : 'concepts');
  }
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); go(j.dataset.jump); }
});

/* ---------- Task ---------- */
function renderTask(v, task) {
  if (!L.ready()) { v.innerHTML = '<div class="card"><p class="muted">Waiting for the SQL engine…</p></div>'; return; }
  const i = TASKS.indexOf(task);
  workspace = L.mount(v, task, ts(task.id), {
    save, onStatus: renderSteps,
    meta: `<span class="tag">${i + 1} / ${TASKS.length}</span><span class="tag level">${esc(task.level)}</span>${task.skills.map(s => `<span class="tag">${esc(SKILLS[s])}</span>`).join('')}`,
    nextLabel: i + 1 < TASKS.length ? 'Next task →' : 'Concept checks →',
    onNext: () => go(i + 1 < TASKS.length ? TASKS[i + 1].id : 'concepts')
  });
}

/* ---------- Concepts ---------- */
function renderConcepts(v) {
  const AB = 'ABCD';
  v.innerHTML = `<div class="card"><h2>Concept checks</h2><p class="note">One try each. These test the rules behind the tasks, mostly window functions and NULLs.</p>` +
    CONCEPTS.map((c, n) => {
      const picked = state.concepts[c.id], answered = picked !== undefined;
      return `<div class="q" data-q="${c.id}"><div class="meta"><span class="tag">${n + 1} / ${CONCEPTS.length}</span><span class="tag">${esc(SKILLS[c.skill])}</span></div>
        <p>${inl(c.q)}</p>${c.code ? `<pre>${esc(c.code)}</pre>` : ''}
        <div class="choices">${c.choices.map((ch, k) => `<button type="button" class="choice${answered && k === c.answer ? ' right' : ''}${answered && k === picked && k !== c.answer ? ' wrong' : ''}" data-k="${k}" ${answered ? 'disabled' : ''}><span class="letter">${AB[k]}</span><span>${inl(ch)}</span></button>`).join('')}</div>
        ${answered ? `<p class="explain"><b>${picked === c.answer ? 'Right.' : 'Not quite.'}</b> ${inl(c.why)}</p>` : ''}</div>`;
    }).join('') + `<div class="actions"><button class="btn primary" type="button" data-jump="report">See the report →</button></div></div>`;
  v.querySelectorAll('.q').forEach(q => q.addEventListener('click', e => {
    const b = e.target.closest('.choice'); if (!b || b.disabled) return;
    state.concepts[q.dataset.q] = +b.dataset.k; save();
    const y = window.scrollY; renderConcepts(v); renderSteps(); window.scrollTo({ top: y });
  }));
}

/* ---------- Report ----------
   A task counts toward the skills it is about. A hidden test counts toward the one skill it checks, so failing
   the "two managers named Uma" test marks grouping, not joins. Concept checks and hidden tests weigh half a task. */
function taskScore(t) {
  if (!t || t.status === 'untouched') return null;
  if (t.status === 'passed') return t.hints ? 0.8 : 1;
  return t.status === 'gaveup' ? 0 : 0.2;
}
function skillRows() {
  return Object.keys(SKILLS).map(k => {
    let sum = 0, w = 0;
    const mine = TASKS.filter(t => t.skills.includes(k));
    const tried = mine.map(t => taskScore(state.tasks[t.id])).filter(s => s !== null);
    tried.forEach(s => { sum += s; w += 1; });
    let tests = 0, clean = 0;
    TASKS.forEach(t => {
      const s = state.tasks[t.id]; if (!s || !s.submits) return;
      t.hidden.filter(h => h.skill === k).forEach(h => {
        tests++;
        const failed = s.failedCases.includes(h.name);
        if (!failed) clean++;
        sum += 0.5 * (failed ? (s.status === 'passed' ? 0.5 : 0) : (s.status === 'passed' ? 1 : 0.5)); w += 0.5;
      });
    });
    const cs = CONCEPTS.filter(c => c.skill === k && c.id in state.concepts);
    const right = cs.filter(c => state.concepts[c.id] === c.answer).length;
    sum += 0.5 * right; w += 0.5 * cs.length;
    const score = w ? sum / w : null;
    const solved = mine.filter(t => state.tasks[t.id] && state.tasks[t.id].status === 'passed').length;
    return { k, name: SKILLS[k], score, verdict: score === null ? 'none' : score >= 0.8 ? 'solid' : score >= 0.5 ? 'shaky' : 'gap',
      tasks: tried.length ? `${solved}/${tried.length}${tried.length < mine.length ? ` · ${mine.length - tried.length} not tried` : ''}` : `– · ${mine.length} not tried`,
      tests: tests ? `${clean}/${tests}` : '–', concepts: cs.length ? `${right}/${cs.length}` : '–' };
  });
}
const VERDICT = { solid: 'Solid', shaky: 'Shaky', gap: 'Gap', none: 'Not tested' };
function renderReport(v) {
  const rows = skillRows(), all = TASKS.map(t => state.tasks[t.id]);
  const passed = all.filter(t => t && t.status === 'passed').length;
  const first = all.filter(t => t && t.status === 'passed' && t.solvedSubmits === 1 && !t.hints).length;
  const ms = all.reduce((a, t) => a + (t ? t.ms : 0), 0);
  const cAns = CONCEPTS.filter(c => c.id in state.concepts), cRight = cAns.filter(c => state.concepts[c.id] === c.answer).length;
  v.innerHTML = `<div class="card">
    <h2>Report</h2>
    <div class="stats">
      <div class="stat"><div class="n">${passed}/${TASKS.length}</div><div class="l">tasks solved</div></div>
      <div class="stat"><div class="n">${first}</div><div class="l">on the first submit, no hints</div></div>
      <div class="stat"><div class="n">${cRight}/${cAns.length}</div><div class="l">concept checks right</div></div>
      <div class="stat"><div class="n">${L.fmtMin(ms)}</div><div class="l">active time</div></div>
    </div>
    <div class="scroll wide"><table class="skills">
      <thead><tr><th>Skill</th><th>Solved / tried</th><th class="hide-sm">Hidden tests passed first time</th><th class="hide-sm">Concepts</th><th class="hide-sm">Score</th><th>Verdict</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="mono">${r.tasks}</td><td class="mono hide-sm">${r.tests}</td><td class="mono hide-sm">${r.concepts}</td>
        <td class="hide-sm"><span class="bar"><i style="width:${r.score === null ? 0 : Math.round(r.score * 100)}%"></i></span></td>
        <td><span class="verdict ${r.verdict}">${VERDICT[r.verdict]}</span></td></tr>`).join('')}</tbody>
    </table></div>
    <p class="note">A solved task scores 1 (0.8 with hints), an unsolved attempt 0.2, a task ended at the solution 0. Each hidden test counts toward the one skill it checks, at half weight, as do concept checks. Solid ≥ 0.8, Shaky ≥ 0.5.</p>
    <h3>Tasks</h3>
    <div class="scroll wide"><table class="skills">
      <thead><tr><th>#</th><th>Task</th><th>Result</th><th class="hide-sm">Submits</th><th class="hide-sm">Hints</th><th class="hide-sm">Time</th><th class="hide-sm">Felt</th></tr></thead>
      <tbody>${TASKS.map((t, i) => { const s = state.tasks[t.id] || {}; return `<tr><td class="mono">${i + 1}</td><td><a href="#${t.id}" data-jump="${t.id}">${esc(t.title)}</a></td>
        <td>${L.STATUS[s.status || 'untouched']}</td><td class="mono hide-sm">${s.submits || 0}</td><td class="mono hide-sm">${s.hints || 0}</td><td class="mono hide-sm">${s.ms ? L.fmtMin(s.ms) : '–'}</td><td class="hide-sm">${s.feel || '–'}</td></tr>`; }).join('')}</tbody>
    </table></div>
    <h3>Use your results</h3>
    <p class="note">Copy the summary (it includes your final query for each task) and paste it into Claude or another AI assistant, or give it to a tutor, to plan what to practise next.</p>
    <div class="actions">
      <button class="btn primary" type="button" id="copy">Copy results</button>
      <button class="btn" type="button" id="dl">Download JSON</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="reset">Reset progress</button>
    </div>
    <div id="copied" class="out"></div>
  </div>`;
  v.querySelector('#copy').addEventListener('click', async () => {
    const text = exportText();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
    v.querySelector('#copied').innerHTML = ok ? '<div class="msg pass">Copied. Paste it into the chat.</div>'
      : `<div class="msg warn">Couldn't reach the clipboard. Select all of this and copy it:</div><textarea class="sql" readonly style="min-height:240px;border:1px solid var(--line);border-radius:8px">${esc(text)}</textarea>`;
  });
  v.querySelector('#dl').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), version: 2, skills: skillRows(), state }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sql-lab-results.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  v.querySelector('#reset').addEventListener('click', () => {
    if (!confirm('Clear all answers, queries and timings in this browser?')) return;
    state = { tasks: {}, concepts: {}, started: null }; save(); go('start');
  });
}
function exportText() {
  const AB = 'ABCD';
  const lines = [`# SQL Lab diagnostic (version 2) results, ${new Date().toISOString().slice(0, 10)}`, '', '## Skills', '', '| Skill | Solved / tried | Hidden tests passed first time | Concepts right | Score | Verdict |', '|---|---|---|---|---|---|'];
  skillRows().forEach(r => lines.push(`| ${r.name} | ${r.tasks} | ${r.tests} | ${r.concepts} | ${r.score === null ? '–' : r.score.toFixed(2)} | ${VERDICT[r.verdict]} |`));
  lines.push('', '## Tasks', '');
  TASKS.forEach((t, i) => {
    const s = state.tasks[t.id] || { status: 'untouched' };
    lines.push(`### ${i + 1}. ${t.title} [${t.level}; ${t.skills.join(', ')}]`);
    lines.push(`- Result: ${L.STATUS[s.status]}${s.status === 'passed' ? ` on submit ${s.solvedSubmits}` : ''}; submits ${s.submits || 0}; runs ${s.runs || 0}; hints ${s.hints || 0}/${t.hints.length}; time ${s.ms ? L.fmtMin(s.ms) : '–'}; felt ${s.feel || '–'}`);
    if (s.failedCases && s.failedCases.length) lines.push(`- Hidden tests failed at some point: ${s.failedCases.map(n => { const h = t.hidden.find(x => x.name === n); return n + (h ? ` [${h.skill}]` : ''); }).join('; ')}`);
    const q = (s.status === 'passed' ? s.lastSubmitted : s.sql) || s.lastSubmitted;
    if (q && q.trim()) lines.push('```sql', q.trim(), '```');
    lines.push('');
  });
  lines.push('## Concept checks', '');
  CONCEPTS.forEach((c, n) => {
    if (!(c.id in state.concepts)) { lines.push(`- ${n + 1}. [${c.skill}] not answered`); return; }
    const p = state.concepts[c.id];
    lines.push(`- ${n + 1}. [${c.skill}] ${p === c.answer ? 'right' : `WRONG: picked ${AB[p]} "${c.choices[p]}", answer ${AB[c.answer]} "${c.choices[c.answer]}"`} (${c.q.replace(/`/g, '')})`);
  });
  return lines.join('\n');
}

/* ---------- Boot ---------- */
const engine = document.getElementById('engine');
const startId = location.hash.slice(1);
go(['concepts', 'report'].includes(startId) || TASKS.some(t => t.id === startId) ? startId : 'start');
L.load().then(v => { engine.textContent = `SQLite ${v} running in your browser · nothing leaves this page`; go(current); })
  .catch(err => { engine.textContent = "The SQL engine didn't load: " + err.message + '. Reload to try again.'; engine.classList.add('err'); });
</script>
</body>
</html>
